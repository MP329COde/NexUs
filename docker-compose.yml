services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env (voir .env.example)}
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # Registre d'images privé (Docker Distribution officielle) — pour les
  # builds propriétaires qui ne peuvent pas atterrir sur Docker Hub public.
  # Authentification htpasswd générée par install.sh (registry-auth/htpasswd,
  # hors dépôt git). Configurez ensuite Paramètres → Registre privé dans la
  # console avec l'URL ci-dessous pour parcourir dépôts/étiquettes.
  registry:
    image: registry:2
    profiles: ["registry"]
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: "Nexus Registry"
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - nexus_registry_data:/var/lib/registry
      - ./registry-auth:/auth:ro
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/v2/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  backend:
    build: ./backend
    environment:
      PORT: 4000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${CONSOLE_PORT:-8080}}
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans .env (voir .env.example)}
      NEXUS_MASTER_KEY: ${NEXUS_MASTER_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD}@postgres:5432/nexus
    volumes:
      - nexus_data:/app/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/status/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "${CONSOLE_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexus_data:
  nexus_pgdata:
  nexus_registry_data:
