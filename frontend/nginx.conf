# Sert les fichiers statiques du build et transmet /api au backend, pour
# qu'un seul port expose toute la console (adapté derrière un reverse proxy
# externe comme Traefik/HAProxy, ou tel quel pour un accès direct).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Application monopage : toute route inconnue retombe sur index.html,
  # react-router-dom se charge du routage côté client.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
