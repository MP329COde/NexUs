<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Nexus Console</title>
    <script>
      // Pose data-theme AVANT le premier paint pour éviter un flash de thème
      // (script bloquant volontairement synchrone, exécuté avant le rendu React ;
      // cf. frontend/src/context/ThemeContext.jsx pour la logique complète/continue).
      (function () {
        try {
          var mode = localStorage.getItem('nexus-theme') || 'system';
          var resolved = mode;
          if (mode === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else if (mode === 'schedule') {
            var h = new Date().getHours();
            resolved = (h < 7 || h >= 20) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
