name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Échoue sur une vulnérabilité connue de sévérité élevée ou critique
      # (jsonwebtoken, axios et le reste des dépendances) — ne bloque pas sur
      # les CVE mineures pour ne pas rendre la CI rouge en permanence sur des
      # avertissements non actionnables à court terme.
      - run: pnpm audit --audit-level=high
        continue-on-error: false

      - run: pnpm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level=high
        continue-on-error: false

      - run: pnpm build
